name: Build Flake Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Flake and pinned Atoll source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Atoll-based Flake
        run: dotnet restore vendor/Atoll/DynamicIsland.csproj

      - name: Build Atoll-based Flake
        run: dotnet build vendor/Atoll/DynamicIsland.csproj --configuration Release --no-restore

      - name: Publish single-file self-contained Windows x64 EXE
        run: dotnet publish vendor/Atoll/DynamicIsland.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:AssemblyName=Flake.Desktop --output artifacts/publish

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "artifacts/publish/Flake.Desktop.exe"
          if (-not (Test-Path $exe)) { throw "Expected executable was not produced: $exe" }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flake-Desktop-win-x64
          path: artifacts/publish/Flake.Desktop.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/publish/Flake.Desktop.exe
          generate_release_notes: true
