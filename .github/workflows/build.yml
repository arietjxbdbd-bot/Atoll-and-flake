name: Build Flake Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Flake.Desktop/Flake.Desktop.csproj

      - name: Build
        run: dotnet build src/Flake.Desktop/Flake.Desktop.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows x64 executable
        run: dotnet publish src/Flake.Desktop/Flake.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/publish

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flake-Desktop-win-x64
          path: artifacts/publish/Flake.Desktop.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/publish/Flake.Desktop.exe
          generate_release_notes: true
